[package]
name = "obscura-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
stealth = ["obscura-net/stealth", "obscura-js/stealth"]
render = ["obscura-js/render", "dep:image"]

[dependencies]
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
obscura-js = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
url = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
sha2 = "0.10"
getrandom = "0.2"
flate2 = "1"

# build.rs bakes data/chrome-windows-v1.json into a gzipped blob so a full
# locally generated catalog is not parsed at startup.
[build-dependencies]
serde_json = { workspace = true }
flate2 = "1"
